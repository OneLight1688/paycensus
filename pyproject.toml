[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paycensus"
version = "0.4.0"
description = "Read-only client for the PayCensus machine-payment census (x402 + MPP, protocol-agnostic entity layer)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "PayCensus Labs" }]
keywords = ["x402", "mpp", "machine-payments", "census", "analytics", "ai-agents"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.scripts]
paycensus-verify = "paycensus.verify:main"

[project.urls]
Homepage = "https://paycensus.com"
Source = "https://github.com/OneLight1688/paycensus"
